components:
  schemas:
    ActivityKind:
      enum:
      - host_threshold
      - unit_transition
      - service_transition
      - schedule_execution
      - schedule_change
      - operation
      type: string
    ActivityRecord:
      additionalProperties: false
      properties:
        evidence:
          additionalProperties:
            type: string
          maxProperties: 32
          type: object
        id:
          maxLength: 64
          type: string
        identity:
          maxLength: 64
          type: string
        kind:
          $ref: '#/components/schemas/ActivityKind'
        message:
          maxLength: 512
          type: string
        occurredAt:
          format: date-time
          type: string
        result:
          $ref: '#/components/schemas/ActivityResult'
        target:
          maxLength: 128
          type: string
        targetType:
          enum:
          - host
          - unit
          - service
          - schedule
          - system
          type: string
      required:
      - id
      - occurredAt
      - kind
      - target
      - message
      type: object
    ActivityResponse:
      additionalProperties: false
      properties:
        records:
          items:
            $ref: '#/components/schemas/ActivityRecord'
          maxItems: 200
          type: array
        requestedAt:
          format: date-time
          type: string
        since:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
      required:
      - since
      - requestedAt
      - records
      type: object
    ActivityResult:
      enum:
      - success
      - failure
      - warning
      - pending
      - info
      - denied
      type: string
    AtlasSnapshot:
      additionalProperties: false
      properties:
        catalogRevision:
          description: SHA-256 digest of the validated, normalized catalog.
          type: string
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
        fresh:
          type: boolean
        generatedAt:
          format: date-time
          type: string
        providers:
          items:
            $ref: '#/components/schemas/ProviderStatus'
          type: array
        schemaVersion:
          const: 1
          type: integer
        services:
          items:
            $ref: '#/components/schemas/ServiceSnapshot'
          type: array
        summary:
          $ref: '#/components/schemas/StateSummary'
        territories:
          items:
            $ref: '#/components/schemas/Territory'
          type: array
      required:
      - schemaVersion
      - generatedAt
      - catalogRevision
      - fresh
      - providers
      - summary
      - territories
      - services
      - diagnostics
      type: object
    Collection:
      additionalProperties: false
      properties:
        atomic:
          const: false
          type: boolean
        completed_at:
          format: date-time
          type: string
        consistency:
          enum:
          - stable
          - changed
          - unknown
          type: string
        started_at:
          format: date-time
          type: string
      required:
      - started_at
      - completed_at
      - atomic
      - consistency
      type: object
    CommandSummary:
      additionalProperties: false
      properties:
        arguments_disclosed:
          const: false
          type: boolean
        executable_name:
          anyOf:
          - type: string
          - type: 'null'
        script_name:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - executable_name
      - script_name
      - arguments_disclosed
      type: object
    ComponentSnapshot:
      additionalProperties: false
      properties:
        ambiguous:
          type: boolean
        cpuPercent:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        deployment:
          anyOf:
          - $ref: '#/components/schemas/DeploymentProvenance'
          - type: 'null'
        health:
          enum:
          - healthy
          - starting
          - unhealthy
          - unconfigured
          - unknown
          type: string
        image:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
        key:
          maxLength: 128
          type: string
        label:
          maxLength: 64
          type: string
        memoryBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        observedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        provider:
          enum:
          - docker
          - systemd
          type: string
        providerRef:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
        required:
          type: boolean
        restartCount:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        role:
          enum:
          - primary
          - worker
          - dependency
          - sidecar
          - shared
          type: string
        state:
          enum:
          - running
          - starting
          - restarting
          - paused
          - stopped
          - missing
          - unknown
          type: string
        uptimeSeconds:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
      required:
      - key
      - label
      - provider
      - providerRef
      - role
      - required
      - state
      - health
      - observedAt
      - image
      - uptimeSeconds
      - restartCount
      - cpuPercent
      - memoryBytes
      type: object
    ControlGroup:
      additionalProperties: false
      properties:
        controllers:
          items:
            maxLength: 64
            type: string
          maxItems: 16
          type: array
        hierarchy_id:
          minimum: 0.0
          type: integer
        path:
          maxLength: 256
          type: string
      required:
      - hierarchy_id
      - controllers
      - path
      type: object
    CopyActionSnapshot:
      additionalProperties: false
      properties:
        type:
          const: copy
          type: string
        url:
          format: uri
          type: string
      required:
      - type
      - url
      type: object
    DependencySnapshot:
      additionalProperties: false
      properties:
        serviceId:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/ServiceState'
      required:
      - serviceId
      - state
      type: object
    DeploymentProvenance:
      additionalProperties: false
      properties:
        commitSha:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
        completedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        deploymentId:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
        environment:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
        startedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        status:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
      required:
      - deploymentId
      - commitSha
      - startedAt
      - completedAt
      - status
      - environment
      type: object
    DiagnosticEndpoint:
      additionalProperties: false
      properties:
        address:
          maxLength: 45
          minLength: 2
          type: string
        namespace:
          const: host
          type: string
        port:
          maximum: 65535.0
          minimum: 1.0
          type: integer
        protocol:
          const: tcp
          type: string
      required:
      - namespace
      - protocol
      - address
      - port
      type: object
    Diagnostics:
      additionalProperties: false
      properties:
        unmappedRuntimes:
          items:
            $ref: '#/components/schemas/UnmappedRuntime'
          type: array
        warnings:
          items:
            maxLength: 240
            type: string
          type: array
      required:
      - unmappedRuntimes
      - warnings
      type: object
    EndpointListenersResult:
      additionalProperties: false
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
        data:
          anyOf:
          - $ref: '#/components/schemas/ListenersData'
          - type: 'null'
        issues:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
        schema_version:
          const: '1.0'
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        service:
          $ref: '#/components/schemas/Id'
        snapshot_id:
          type: string
        source_uri:
          type: string
        status:
          enum:
          - complete
          - partial
          - unavailable
          type: string
      required:
      - schema_version
      - snapshot_id
      - service
      - status
      - scope
      - collection
      - data
      - issues
      - source_uri
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          pattern: ^[A-Z][A-Z0-9_]*$
          type: string
        message:
          maxLength: 240
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      type: object
    FilesystemEvidence:
      additionalProperties: false
      properties:
        device:
          maxLength: 240
          type: string
        freeBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        freeInodes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        fstype:
          maxLength: 64
          type: string
        inodeUsedPercent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
        mountPoint:
          maxLength: 240
          type: string
        state:
          $ref: '#/components/schemas/FilesystemState'
        totalBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        totalInodes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        usedBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        usedPercent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
      required:
      - mountPoint
      - device
      - fstype
      - totalBytes
      - freeBytes
      - usedBytes
      - usedPercent
      - totalInodes
      - freeInodes
      - inodeUsedPercent
      - state
      type: object
    FilesystemState:
      enum:
      - ok
      - full
      - inode_pressure
      - degraded
      - unavailable
      type: string
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          enum:
          - ok
          - ready
          type: string
      required:
      - status
      type: object
    HostCpuEvidence:
      additionalProperties: false
      properties:
        loadAverage15m:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        loadAverage1m:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        loadAverage5m:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        utilizationPercent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
      required:
      - utilizationPercent
      - loadAverage1m
      - loadAverage5m
      - loadAverage15m
      type: object
    HostEvidence:
      additionalProperties: false
      properties:
        bootTime:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        cpu:
          $ref: '#/components/schemas/HostCpuEvidence'
        filesystems:
          items:
            $ref: '#/components/schemas/FilesystemEvidence'
          type: array
        fresh:
          type: boolean
        hostname:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
        interfaces:
          items:
            $ref: '#/components/schemas/NetworkInterfaceEvidence'
          type: array
        memory:
          $ref: '#/components/schemas/HostMemoryEvidence'
        observedAt:
          format: date-time
          type: string
        pressure:
          items:
            $ref: '#/components/schemas/PressureEvidence'
          type: array
        providerMessage:
          anyOf:
          - maxLength: 240
            type: string
          - type: 'null'
        providerState:
          enum:
          - available
          - degraded
          - unavailable
          type: string
        temperatures:
          items:
            $ref: '#/components/schemas/TemperatureEvidence'
          type: array
        uptimeSeconds:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
      required:
      - observedAt
      - fresh
      - uptimeSeconds
      - bootTime
      - cpu
      - memory
      - filesystems
      - interfaces
      - pressure
      - temperatures
      - providerState
      type: object
    HostHistoryResponse:
      additionalProperties: false
      properties:
        observedAt:
          format: date-time
          type: string
        samples:
          items:
            $ref: '#/components/schemas/HostEvidence'
          type: array
        windowSeconds:
          minimum: 0.0
          type: integer
      required:
      - windowSeconds
      - observedAt
      - samples
      type: object
    HostMemoryEvidence:
      additionalProperties: false
      properties:
        availableBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        swapFreeBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        swapTotalBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        swapUsedPercent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
        totalBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        usedBytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        usedPercent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
      required:
      - totalBytes
      - availableBytes
      - usedBytes
      - usedPercent
      - swapTotalBytes
      - swapFreeBytes
      - swapUsedPercent
      type: object
    Id:
      maxLength: 64
      minLength: 1
      pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      type: string
    InterfaceState:
      enum:
      - up
      - down
      - unknown
      type: string
    Issue:
      additionalProperties: false
      properties:
        code:
          maxLength: 64
          type: string
        fields:
          items:
            maxLength: 128
            type: string
          maxItems: 16
          type: array
        retryable:
          type: boolean
      required:
      - code
      - fields
      - retryable
      type: object
    LastExecution:
      additionalProperties: false
      properties:
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
        exit_status:
          anyOf:
          - type: integer
          - type: 'null'
        exited_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        exited_monotonic_us:
          anyOf:
          - type: integer
          - type: 'null'
        pid:
          anyOf:
          - type: integer
          - type: 'null'
        result:
          anyOf:
          - type: string
          - type: 'null'
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        started_monotonic_us:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - pid
      - result
      - exit_code
      - exit_status
      - started_at
      - exited_at
      - started_monotonic_us
      - exited_monotonic_us
      type: object
    Listener:
      additionalProperties: false
      properties:
        endpoint_overlap:
          enum:
          - exact
          - wildcard
          - potential_ipv6
          type: string
        family:
          enum:
          - ipv4
          - ipv6
          type: string
        incompatible_bind:
          const: unknown
          type: string
        inode:
          minimum: 1.0
          type: integer
        local_address:
          type: string
        local_port:
          type: integer
        network_namespace_ref:
          type: string
        owners:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProcessIdentity'
            maxItems: 12
            type: array
          - type: 'null'
        protocol:
          const: tcp
          type: string
        socket_id:
          type: string
        state:
          const: LISTEN
          type: string
      required:
      - socket_id
      - inode
      - family
      - protocol
      - network_namespace_ref
      - local_address
      - local_port
      - state
      - endpoint_overlap
      - incompatible_bind
      - owners
      type: object
    ListenerCoverage:
      additionalProperties: false
      properties:
        owner_resolution:
          enum:
          - complete
          - partial
          - unavailable
          type: string
        socket_enumeration:
          enum:
          - complete
          - partial
          - unavailable
          type: string
        truncated:
          type: boolean
      required:
      - socket_enumeration
      - owner_resolution
      - truncated
      type: object
    ListenersData:
      additionalProperties: false
      properties:
        coverage:
          $ref: '#/components/schemas/ListenerCoverage'
        endpoint:
          $ref: '#/components/schemas/DiagnosticEndpoint'
        endpoint_id:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
        listeners:
          anyOf:
          - items:
              $ref: '#/components/schemas/Listener'
            maxItems: 24
            type: array
          - type: 'null'
      required:
      - endpoint_id
      - endpoint
      - listeners
      - coverage
      type: object
    LogRecord:
      additionalProperties: false
      properties:
        message:
          maxLength: 16384
          type: string
        provider:
          enum:
          - docker
          - journald
          type: string
        severity:
          anyOf:
          - enum:
            - debug
            - info
            - notice
            - warning
            - error
            - critical
            - alert
            - emergency
            type: string
          - type: 'null'
        source:
          maxLength: 128
          type: string
        stream:
          enum:
          - stdout
          - stderr
          - journal
          - unknown
          type: string
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        truncated:
          type: boolean
      required:
      - timestamp
      - source
      - provider
      - stream
      - severity
      - message
      - truncated
      type: object
    LogSource:
      additionalProperties: false
      properties:
        available:
          type: boolean
        key:
          maxLength: 128
          type: string
        label:
          maxLength: 64
          type: string
        provider:
          enum:
          - docker
          - journald
          type: string
      required:
      - key
      - label
      - provider
      - available
      type: object
    LogsResponse:
      additionalProperties: false
      properties:
        records:
          items:
            $ref: '#/components/schemas/LogRecord'
          maxItems: 500
          type: array
        requestedAt:
          format: date-time
          type: string
        serviceId:
          $ref: '#/components/schemas/Id'
        source:
          anyOf:
          - type: string
          - type: 'null'
        truncated:
          type: boolean
      required:
      - serviceId
      - requestedAt
      - source
      - records
      - truncated
      type: object
    ManagedScheduleDefinition:
      additionalProperties: false
      properties:
        arguments:
          items:
            type: string
          maxItems: 64
          type: array
        description:
          maxLength: 256
          type: string
        executable:
          maxLength: 256
          minLength: 1
          pattern: ^/[^ \t]+$
          type: string
        missedRunBehavior:
          enum:
          - ignore
          - catch_up
          type: string
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9-]*$
          type: string
        onCalendar:
          maxLength: 128
          minLength: 1
          type: string
        overlapPolicy:
          enum:
          - allow
          - drop
          - queue
          type: string
        relatedService:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
        timeoutSeconds:
          maximum: 86400.0
          minimum: 1.0
          type: integer
        user:
          maxLength: 64
          pattern: ^[a-z_][a-z0-9_-]*$
          type: string
        workingDirectory:
          anyOf:
          - maxLength: 256
            pattern: ^/[^ \t]*$
            type: string
          - type: 'null'
      required:
      - name
      - onCalendar
      - executable
      type: object
    ManagedScheduleView:
      additionalProperties: false
      properties:
        definition:
          $ref: '#/components/schemas/ManagedScheduleDefinition'
        enabled:
          type: boolean
        installed:
          type: boolean
        lastResult:
          $ref: '#/components/schemas/ScheduleResult'
        lastRun:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        revision:
          minimum: 0.0
          type: integer
        serviceUnit:
          maxLength: 128
          type: string
        timerUnit:
          maxLength: 128
          type: string
      required:
      - definition
      - revision
      - serviceUnit
      - timerUnit
      - lastRun
      type: object
    ManagerScope:
      additionalProperties: false
      properties:
        kind:
          enum:
          - system
          - user
          - unknown
          type: string
        uid:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - kind
      - uid
      type: object
    NetworkInterfaceEvidence:
      additionalProperties: false
      properties:
        name:
          maxLength: 64
          type: string
        rxBytesPerSecond:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        rxBytesTotal:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
        state:
          $ref: '#/components/schemas/InterfaceState'
        txBytesPerSecond:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
        txBytesTotal:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
      required:
      - name
      - state
      - rxBytesTotal
      - txBytesTotal
      - rxBytesPerSecond
      - txBytesPerSecond
      type: object
    NoneActionSnapshot:
      additionalProperties: false
      properties:
        type:
          const: none
          type: string
      required:
      - type
      type: object
    OpenActionSnapshot:
      additionalProperties: false
      properties:
        type:
          const: open
          type: string
        url:
          format: uri
          type: string
      required:
      - type
      - url
      type: object
    OperationKind:
      enum:
      - start
      - stop
      - restart
      - enable
      - disable
      - trigger
      type: string
    OperationRequest:
      additionalProperties: false
      properties:
        expectedState:
          anyOf:
          - $ref: '#/components/schemas/UnitState'
          - type: 'null'
        operation:
          $ref: '#/components/schemas/OperationKind'
        reason:
          maxLength: 240
          type: string
      required:
      - operation
      type: object
    OperationResult:
      additionalProperties: false
      properties:
        evidence:
          additionalProperties:
            type: string
          maxProperties: 32
          type: object
        id:
          maxLength: 64
          type: string
        message:
          maxLength: 512
          type: string
        operation:
          $ref: '#/components/schemas/OperationKind'
        reconciledAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        requestedAt:
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/OperationState'
        unit:
          maxLength: 128
          type: string
      required:
      - id
      - unit
      - operation
      - state
      - requestedAt
      - reconciledAt
      type: object
    OperationState:
      enum:
      - pending
      - success
      - partial
      - timeout
      - failed
      - denied
      - stale
      - helper_unavailable
      type: string
    Owner:
      additionalProperties: false
      properties:
        container_ref:
          anyOf:
          - type: string
          - type: 'null'
        kind:
          enum:
          - systemd
          - container
          - unknown
          type: string
        manager_scope:
          $ref: '#/components/schemas/ManagerScope'
        method:
          enum:
          - cgroup_path
          - unavailable
          type: string
        unit_name:
          anyOf:
