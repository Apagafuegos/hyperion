  securitySchemes:
    authentikIdentity:
      in: header
      name: X-Authentik-Username
      type: apiKey
info:
  description: Read-only API for the single-VPS Hyperion service atlas.
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/activity:
    get:
      description: Get recorded activity events, newest-first.
      operationId: getActivity
      parameters:
      - in: query
        name: since
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
      - in: query
        name: limit
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          description: Recorded events newest-first.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Get recorded activity
  /api/v1/diagnostics/endpoint-listeners:
    get:
      operationId: get_endpoint_listeners_api_v1_diagnostics_endpoint_listeners_get
      parameters:
      - in: query
        name: service
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - in: query
        name: endpoint_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointListenersResult'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Endpoint Listeners
      tags:
      - diagnostics
  /api/v1/diagnostics/process:
    get:
      operationId: inspect_process_api_v1_diagnostics_process_get
      parameters:
      - in: query
        name: service
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - in: query
        name: process_ref
        required: true
        schema:
          maxLength: 37
          minLength: 37
          pattern: ^proc_[A-Za-z0-9_-]{32}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResult'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Inspect Process
      tags:
      - diagnostics
  /api/v1/diagnostics/service-runtime:
    get:
      operationId: get_service_runtime_api_v1_diagnostics_service_runtime_get
      parameters:
      - in: query
        name: service
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRuntimeResult'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Service Runtime
      tags:
      - diagnostics
  /api/v1/host:
    get:
      description: Get the current bounded host evidence sample.
      operationId: getHost
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostEvidence'
          description: Current host metric evidence.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Get current host evidence
  /api/v1/host/history:
    get:
      description: Get bounded recent host samples within the requested window.
      operationId: getHostHistory
      parameters:
      - in: query
        name: window
        required: false
        schema:
          pattern: ^\d+[smh]$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostHistoryResponse'
          description: Bounded recent host samples, oldest first.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Get recent host history samples
  /api/v1/schedules:
    get:
      description: Get the unified schedule inventory from systemd timers and cron.
      operationId: getSchedules
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInventoryResponse'
          description: Normalized systemd timer and cron schedule index.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Get the schedule inventory
    post:
      description: Create a managed schedule as a systemd service/timer pair.
      operationId: createSchedule
      parameters:
      - in: header
        name: Origin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedScheduleDefinition'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedScheduleView'
          description: The installed managed schedule.
        '400':
          description: Definition failed validation.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Create a Hyperion-managed schedule
  /api/v1/schedules/{scheduleId}:
    delete:
      description: Delete a managed schedule; the timer and service units are removed.
      operationId: deleteSchedule
      parameters:
      - in: path
        name: scheduleId
        required: true
        schema:
          type: string
      - in: query
        name: expectedRevision
        required: false
        schema:
          minimum: 0
          type: integer
      - in: header
        name: Origin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '204':
          description: The managed schedule was deleted.
        '400':
          description: Revision or existence validation failed.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Delete a Hyperion-managed schedule
    get:
      description: Get one schedule record by inventory identity.
      operationId: getSchedule
      parameters:
      - in: path
        name: scheduleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSnapshot'
          description: A single schedule record.
        '401':
          description: Authentik identity header is absent.
        '404':
          description: Schedule is not in the inventory.
      security:
      - APIKeyHeader: []
      summary: Get one schedule record
    put:
      description: Update a managed schedule with optimistic-concurrency revision
        control.
      operationId: updateSchedule
      parameters:
      - in: path
        name: scheduleId
        required: true
        schema:
          type: string
      - in: query
        name: expectedRevision
        required: false
        schema:
          minimum: 0
          type: integer
      - in: header
        name: Origin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedScheduleDefinition'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedScheduleView'
          description: The updated managed schedule.
        '400':
          description: Definition or revision failed validation.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Update a Hyperion-managed schedule
  /api/v1/services/{serviceId}/logs:
    get:
      description: Get bounded recent logs for one allowlisted service.
      operationId: getServiceLogs
      parameters:
      - in: path
        name: serviceId
        required: true
        schema:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
      - description: Allowlisted component selector. Omit to aggregate all configured
          sources.
        in: query
        name: source
        required: false
        schema:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          description: Allowlisted component selector. Omit to aggregate all configured
            sources.
      - in: query
        name: tail
        required: false
        schema:
          enum:
          - 50
          - 100
          - 250
          - 500
          type: integer
      - description: Exclusive RFC 3339 upper timestamp for bounded backward pagination.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Exclusive RFC 3339 upper timestamp for bounded backward pagination.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
          description: Logs sorted oldest to newest.
          headers:
            Cache-Control:
              required: true
              schema:
                const: private, no-store
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentik identity header is absent.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service or log source is not in the validated catalog.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Required provider data is temporarily unavailable.
      security:
      - APIKeyHeader: []
      summary: Get bounded recent logs for one allowlisted service
  /api/v1/snapshot:
    get:
      description: Get the complete normalized atlas snapshot.
      operationId: getSnapshot
      parameters:
      - in: header
        name: If-None-Match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasSnapshot'
          description: Current normalized service snapshot.
          headers:
            Cache-Control:
              required: true
              schema:
                const: private, max-age=0, must-revalidate
                type: string
            ETag:
              required: true
              schema:
                type: string
        '304':
          description: Snapshot has not changed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentik identity header is absent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Required provider data is temporarily unavailable.
      security:
      - APIKeyHeader: []
      summary: Get the complete normalized atlas snapshot
  /api/v1/units:
    get:
      description: Get the systemd service inventory with per-unit property evidence.
      operationId: getUnits
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitInventoryResponse'
          description: Curated systemd service inventory.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Get the systemd unit inventory
  /api/v1/units/{unitName}/logs:
    get:
      description: Get bounded journal logs for one server-enumerated unit.
      operationId: getUnitLogs
      parameters:
      - in: path
        name: unitName
        required: true
        schema:
          type: string
      - in: query
        name: tail
        required: false
        schema:
          enum:
          - 50
          - 100
          - 250
          - 500
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitLogsResponse'
          description: Journal logs for the unit, oldest to newest.
        '401':
          description: Authentik identity header is absent.
        '404':
          description: Unit is not in the server-enumerated inventory.
        '503':
          description: Journal is temporarily unavailable.
      security:
      - APIKeyHeader: []
      summary: Get bounded journal logs for one unit
  /api/v1/units/{unitName}/operations:
    post:
      description: Request one typed operation; idempotent per idempotency key.
      operationId: postOperation
      parameters:
      - in: path
        name: unitName
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 64
          minLength: 8
          type: string
      - in: header
        name: Origin
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
          description: The operation result, pending or terminal.
        '401':
          description: Authentik identity header is absent.
      security:
      - APIKeyHeader: []
      summary: Request a typed systemd operation
  /healthz:
    get:
      description: Process liveness check.
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: The process is alive.
      security: []
      summary: Process liveness check
  /readyz:
    get:
      description: Catalog and initial snapshot readiness check.
      operationId: getReadiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: The catalog is valid and an initial snapshot exists.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The application cannot yet serve a valid atlas snapshot.
      security: []
      summary: Catalog and initial snapshot readiness check
security:
- authentikIdentity: []
servers:
- url: /
